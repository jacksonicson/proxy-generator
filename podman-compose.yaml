version: '3.8'

services:
  proxy-generator:
    build: .
    image: nas-proxy-generator
    container_name: nas-proxy-generator
    restart: unless-stopped
    volumes:
      # Left side: Path to your NAS mount on your Optiplex host
      # Right side: Inside the container (/data)
      - /mnt/nas/photography/photos/pic_lightroom/2026/2026-10-10:/data
    command: ["-dir", "/data"]
    # If your Optiplex uses an Intel iGPU for hardware acceleration, uncomment below:
    devices:
      - /dev/dri:/dev/dri
